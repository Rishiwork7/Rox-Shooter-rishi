name: Build Secure Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyarmor
        pip install -r requirements.txt

    - name: Obfuscate Code (PyArmor)
      run: |
        pyarmor gen main.py
        # This creates 'dist/main.py' and 'dist/pyarmor_runtime_000000/'

    - name: Compile to EXE (PyInstaller)
      run: |
        # We run pyinstaller on the obfuscated file inside the dist folder
        # We must include the pyarmor runtime directory
        pyinstaller --noconfirm --onefile --windowed --name "RoxMailer_Secure" --add-data "dist/pyarmor_runtime_000000;pyarmor_runtime_000000" dist/main.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RoxMailer-V3-Secure
        path: dist/RoxMailer_Secure.exe
